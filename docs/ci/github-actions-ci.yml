# =============================================================================
# GlobalHealth CI — GitHub Actions workflow
#
# ACTIVATE WITH ONE COMMAND (from the repo root):
#
#     mkdir -p .github/workflows && cp docs/ci/github-actions-ci.yml .github/workflows/ci.yml
#
# It lives here rather than in .github/workflows/ because the automation token
# used to prepare this branch is not permitted to create files under
# .github/workflows/ (GitHub blocks workflow changes from Apps without the
# `workflows` permission). Copying it into place once activates it; after that
# normal commits to it work.
#
# Gates every push and PR on the same three things a deploy host does:
# typecheck, tests, and a production build that passes the deploy preflight.
# If this workflow is green, `npm start` on the target host will boot.
# =============================================================================

name: CI

# Gate every push and PR on the same three things a deploy host does:
# typecheck, tests, and a production build that passes the deploy preflight.
# If this workflow is green, `npm start` on the target host will boot.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref — saves CI minutes on rapid pushes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  verify:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Deployment preflight
        run: npm run deploy:check

      - name: Smoke-test the production server
        run: |
          set -euo pipefail
          node scripts/start.mjs &
          SERVER_PID=$!
          # Wait for the port rather than sleeping a fixed amount.
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3000/healthz > /dev/null 2>&1; then
              echo "Server is up after ${i}s"
              break
            fi
            if [ "$i" -eq 40 ]; then
              echo "::error::Server did not become healthy within 40s"
              exit 1
            fi
            sleep 1
          done

          echo "--- /healthz ---"
          curl -fsS http://127.0.0.1:3000/healthz
          echo
          echo "--- /readyz ---"
          curl -fsS http://127.0.0.1:3000/readyz
          echo

          # The SPA shell must be served, not a 503 placeholder.
          curl -fsS http://127.0.0.1:3000/ | grep -q '<div id="root">' \
            || { echo "::error::SPA shell was not served at /"; exit 1; }

          # Hash-free assets must be revalidated so a deploy is picked up at once.
          CC=$(curl -fsSI http://127.0.0.1:3000/sw.js | tr -d '\r' | awk -F': ' 'tolower($1)=="cache-control"{print $2}')
          case "$CC" in
            *no-cache*) echo "sw.js Cache-Control OK: $CC" ;;
            *) echo "::error::sw.js must not be long-cached (got: $CC)"; exit 1 ;;
          esac

          # Compression must actually be negotiated.
          ENC=$(curl -fsSI -H 'Accept-Encoding: gzip' http://127.0.0.1:3000/ | tr -d '\r' | awk -F': ' 'tolower($1)=="content-encoding"{print $2}')
          echo "content-encoding for / with gzip requested: ${ENC:-none}"

          kill $SERVER_PID
          wait $SERVER_PID 2>/dev/null || true
          echo "Smoke test passed."

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Build only (no push) so a broken Dockerfile fails the PR rather than
      # the deployment. Uses the GitHub Actions layer cache for speed.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: globalhealth:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the container
        run: |
          set -euo pipefail
          docker run -d --name gh-ci -p 3000:3000 \
            -e GH_RUNTIME_DIR=/app/data \
            globalhealth:ci

          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/healthz > /dev/null 2>&1; then
              echo "Container healthy after ${i}s"
              break
            fi
            if [ "$i" -eq 45 ]; then
              echo "::error::Container did not become healthy"
              docker logs gh-ci
              exit 1
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:3000/healthz
          echo
          docker logs gh-ci
          docker rm -f gh-ci

      - name: Report image size
        run: docker image ls globalhealth:ci
